name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - name: shellcheck the PITR script
        run: shellcheck backup/pitr.sh

  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The catalog columns these checks read moved between these releases;
        # running one of them would hide exactly the bug the gating prevents.
        image: ["postgres:17-alpine", "postgres:16-alpine"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
        env:
          PGTK_TEST_IMAGES: ${{ matrix.image }}

  pitr:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: restore to a point in time and verify the row boundary
        run: bash backup/pitr.sh

  demo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: docker compose up -d --wait
      - run: python -m demo.run
      - if: always()
        run: docker compose down -v
